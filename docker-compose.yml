services:
  openev-web:
    container_name: openev-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - proxy
    environment:
      # The odds API is internal; it is never exposed through Traefik.
      - OPENEV_API_URL=http://openev-api:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openev-web.rule=Host(`openev.coding-global.com`)"
      - "traefik.http.routers.openev-web.entrypoints=websecure"
      - "traefik.http.services.openev-web.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
